name: Weekly Google Scholar sync

on:
  schedule:
    - cron: "23 9 * * 1"   # Mondays, 09:23 UTC
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: scholar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Scholar profiles and rebuild data
        env:
          # Optional fallback if Scholar blocks the runner. Add it under
          # Settings → Secrets and variables → Actions (free key at serpapi.com).
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/sync_scholar.py

      - name: Commit if anything changed
        run: |
          FILES="assets/data/metrics.json assets/data/publications.json scripts/cache/scholar_rows.json"
          if git diff --quiet -- $FILES; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Weekly Google Scholar sync"
          git push
          # Ask Pages to rebuild in case the bot push doesn't trigger it.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
